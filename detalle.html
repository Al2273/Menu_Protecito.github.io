<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Juego - Protecito Anticafé</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Chewy&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* COLORES ROSADOS ORIGINALES RESTAURADOS */
            --bg-color: #ffd6e8;
            --text-dark: #3a2224;
            --highlight: #f596c5;
            --price-color: #5c3538;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 40px 15px;
            display: flex;
            justify-content: center;
            background-image: 
                radial-gradient(#f596c5 15%, transparent 16%),
                radial-gradient(#f596c5 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .menu-container {
            background-color: var(--bg-color);
            max-width: 800px;
            width: 100%;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15), inset 0 0 20px rgba(255,255,255,0.5);
            position: relative;
        }

        .menu-inner-border {
            border: 3px dashed #f18bbd;
            border-radius: 15px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.4); 
            position: relative;
            z-index: 3;
            min-height: 50vh;
        }

        /* BOTÓN VOLVER (Estilo Rosado) */
        .btn-volver-container { margin-bottom: 20px; }
        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #fff;
            color: #d85c96;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 8px 20px;
            border-radius: 25px;
            border: 3px solid #d85c96;
            box-shadow: 0 4px 0 #d85c96;
            transition: all 0.1s ease;
        }
        .btn-volver:hover { transform: translateY(2px); box-shadow: 0 2px 0 #d85c96; }
        .btn-volver:active { transform: translateY(4px); box-shadow: 0 0 0 #d85c96; }

        /* CONTENIDO DEL JUEGO */
        .game-header {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            align-items: center;
        }

        .game-main-img {
            width: 250px;
            height: 250px;
            border-radius: 15px;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background-color: #fce4ec;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
        }

        .game-title-section h1 {
            font-family: 'Chewy', cursive;
            font-size: 3.5rem;
            margin: 0 0 15px 0;
            line-height: 1.1;
            text-shadow: 2px 2px 0px #fff; 
            text-align: left;
        }

        .game-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .stat-badge {
            background-color: var(--highlight);
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(245, 150, 197, 0.4);
        }

        .game-description {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #5c3538;
            font-weight: 700;
        }

        /* SECCIÓN CÓMO JUGAR */
        .how-to-play {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #ffd6e8;
            margin-top: 20px;
        }

        .how-to-play h2 {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            margin: 0 0 15px 0;
            text-align: left;
        }

        .how-to-play ul {
            padding-left: 20px;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-dark);
            font-weight: 600;
        }

        .how-to-play li {
            margin-bottom: 10px;
        }

        .error-message {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 50px;
        }

        @media (max-width: 600px) {
            .game-header { flex-direction: column; text-align: center; gap: 15px; }
            .game-title-section h1 { text-align: center; font-size: 2.8rem; }
            .game-stats { justify-content: center; flex-wrap: wrap; }
            .how-to-play h2 { text-align: center; }
            .game-main-img { width: 200px; height: 200px; }
        }

        /* Imágenes decorativas */
        .axolotl-img { position: absolute; z-index: 10; pointer-events: none; filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.15)); }
        .axolotl-1 { top: -45px; right: -30px; width: 140px; transform: scaleX(-1); } 
    </style>
</head>

    // 1. Obtener el nombre del juego desde la URL (ej: detalle.html?juego=Uno%20Clásico)
    const urlParams = new URLSearchParams(window.location.search);
    const nombreJuego = urlParams.get('juego');

    const contentDiv = document.getElementById('game-content');

    // 2. Buscar si el juego existe en nuestra base de datos
    if (nombreJuego && juegosDetalle[nombreJuego]) {
        const juego = juegosDetalle[nombreJuego];
        
        // 3. Crear la lista de instrucciones en HTML (<ul><li>...</li></ul>)
        let instruccionesHTML = '';
        juego.instrucciones.forEach(paso => {
            instruccionesHTML += `<li>${paso}</li>`;
        });

        // 4. Inyectar el diseño en la página
        contentDiv.innerHTML = `
            <div class="game-header">
                <img src="${juego.imagen}" alt="${nombreJuego}" class="game-main-img" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'game-main-img\\'>🎲</div>'">
                <div class="game-title-section">
                    <h1>${nombreJuego}</h1>
                    <div class="game-stats">
                        <span class="stat-badge">👥 ${juego.jugadores} Jugadores</span>
                        <span class="stat-badge">⏱️ ${juego.tiempo}</span>
                    </div>
                    <p class="game-description">${juego.descripcion}</p>
                </div>
            </div>

            <div class="how-to-play">
                <h2>¿Cómo se juega?</h2>
                <ul>
                    ${instruccionesHTML}
                </ul>
            </div>
        `;
    } else {
        // 5. Mensaje de error si el usuario entra a la página sin seleccionar un juego válido
        contentDiv.innerHTML = `
            <div class="error-message">
                <p>Ups... No encontramos los detalles de este juego 🎲</p>
                <a href="juegos.html" class="btn-volver" style="margin-top:20px;">Explorar Ludoteca</a>
            </div>
        `;
