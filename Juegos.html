<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos de Mesa - Protecito Anticafé</title>
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Chewy&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* NUEVA PALETA DE COLORES INSPIRADA EN EL LOGO */
            --bg-color: #f6ebd8; /* Crema/Beige claro del cuerpo */
            --text-dark: #3e1f13; /* Marrón chocolate oscuro de las letras */
            --highlight: #a96f4c; /* Marrón cálido de las branquias */
            --accent-peach: #ffa89c; /* Durazno del rubor de las mejillas */
            --card-bg: rgba(255, 255, 255, 0.75);
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 40px 15px;
            display: flex;
            justify-content: center;
            /* Puntos de fondo en un marrón muy suave */
            background-image: 
                radial-gradient(rgba(169, 111, 76, 0.25) 15%, transparent 16%),
                radial-gradient(rgba(169, 111, 76, 0.25) 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            scroll-behavior: smooth; 
        }

        .menu-container {
            background-color: var(--bg-color);
            max-width: 700px;
            width: 100%;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 15px 40px rgba(62, 31, 19, 0.15), inset 0 0 20px rgba(255,255,255,0.6);
            position: relative;
        }

        .menu-inner-border {
            border: 3px dashed var(--highlight);
            border-radius: 15px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.4);
            position: relative;
            z-index: 3;
        }

        h1 {
            font-family: 'Chewy', cursive;
            text-align: center;
            font-size: 3.5rem;
            margin: 0;
            line-height: 1.1;
            letter-spacing: 2px;
            color: var(--text-dark);
            text-shadow: 2px 2px 0px #fff; 
        }

        .subtitle {
            text-align: center;
            font-size: 1.3rem;
            margin-top: 5px;
            margin-bottom: 30px;
            font-weight: 800;
            color: #5c3826;
            letter-spacing: 1px;
        }

        h2 {
            font-family: 'Caveat', cursive;
            text-align: center;
            font-size: 2.8rem;
            position: relative;
            display: inline-block;
            margin: 10px 0 25px 0;
            z-index: 1;
            color: var(--text-dark);
            padding: 0 15px;
        }

        h2::after {
            content: "";
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            height: 16px;
            background-color: var(--highlight);
            z-index: -1;
            border-radius: 8px;
            opacity: 0.7;
            transform: rotate(-1.5deg);
        }

        /* ESTILOS DEL BUSCADOR */
        .search-container {
            text-align: center;
            margin-bottom: 25px;
            padding: 0 50px;
        }

        .search-bar {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            font-size: 1.1rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border: 3px solid #d4a383;
            border-radius: 25px;
            outline: none;
            background-color: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            border-color: #8b5133;
            box-shadow: 0 0 10px rgba(139, 81, 51, 0.3);
            transform: scale(1.02);
        }

        .search-bar::placeholder {
            color: #b5927f;
        }

        /* SISTEMA DE TARJETAS DE JUEGOS */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(62, 31, 19, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            border: 2px solid #fff;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(62, 31, 19, 0.15);
        }

        .game-img-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #f2ddc9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .img-placeholder {
            font-size: 3rem;
            opacity: 0.4;
            position: absolute;
            z-index: 1;
        }

        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }

        .game-info {
            padding: 12px 10px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-title {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--text-dark);
            margin-bottom: 5px;
            line-height: 1.2;
        }

        .game-details {
            font-size: 0.85rem;
            color: #6a4245;
            font-weight: 700;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 1.2rem;
            color: #8b5133;
            padding: 20px;
            font-weight: 800;
        }

        /* BOTÓN VOLVER ARRIBA */
        .btn-top {
            display: none; 
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 99;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            border: none;
            outline: none;
            background-color: #8b5133;
            color: white;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(62, 31, 19, 0.3);
            transition: background-color 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-top:hover {
            background-color: #683921;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 15px rgba(62, 31, 19, 0.4);
        }

        /* BOTÓN VOLVER */
        .btn-volver-container {
            text-align: center;
            margin: 30px 0 10px 0;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #fff;
            color: #8b5133;
            text-decoration: none;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 10px 25px;
            border-radius: 25px;
            border: 3px solid #8b5133;
            box-shadow: 0 4px 0 #8b5133;
            transition: all 0.1s ease;
            position: relative;
            z-index: 5;
        }

        .btn-volver:hover {
            background-color: #f6ebd8;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #8b5133;
        }

        .btn-volver:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #8b5133;
        }

        /* Imágenes decorativas */
        .axolotl-img { position: absolute; z-index: 10; pointer-events: none; filter: drop-shadow(0px 10px 10px rgba(62, 31, 19, 0.15)); }
        .axolotl-1 { top: -45px; left: -40px; width: 170px; } 
        .axolotl-2 { top: 20px; right: -25px; width: 150px; transform: rotate(15deg) scaleX(-1); }

        /* Manchas de color durazno basadas en las mejillas del ajolote */
        .color-blob { position: absolute; background-color: var(--accent-peach); border-radius: 50%; z-index: 1; }
        .blob-1 { top: -20px; left: -30px; width: 180px; height: 160px; opacity: 0.7; }
        .blob-2 { bottom: -30px; right: -40px; width: 220px; height: 220px; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; opacity: 0.7; }

        @media (max-width: 480px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 2.2rem; }
            .menu-inner-border { padding: 20px 15px; }
            
            .games-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .game-info { padding: 10px 5px; }
            .game-title { font-size: 1rem; }
            .game-details { font-size: 0.75rem; }
            
            .axolotl-1 { width: 115px; left: -20px; top: -30px; }
            .axolotl-2 { width: 100px; right: -15px; top: 10px; }
            
            .btn-top { bottom: 15px; right: 15px; width: 45px; height: 45px; font-size: 1.2rem; }
        }

    </style>
</head>
<body>

<!-- BOTÓN FLOTANTE PARA VOLVER ARRIBA -->
<a href="#" id="btnTop" class="btn-top" title="Volver arriba">
    ⇮
</a>

<div class="menu-container">
    
    <img src="ajolote_1.png" class="axolotl-img axolotl-1" alt=" ">
    <img src="ajolote_2.png" class="axolotl-img axolotl-2" alt=" ">

    <!-- Manchas decorativas actualizadas al tono durazno -->
    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    
    <div class="menu-inner-border">
        <h1>LUDOTECA</h1>
        <div class="subtitle">Diviértete mientras disfrutas</div>

        <div class="btn-volver-container">
            <a href="index.html" class="btn-volver">
                ☕ Volver al Menú
            </a>
        </div>

        <div class="section-center">
            <h2>Nuestros Juegos</h2>
        </div>
        
        <!-- BARRA DE BÚSQUEDA -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Buscar juego">
        </div>

        <!-- CONTENEDOR DE JUEGOS -->
        <div class="games-grid" id="games-container"></div>

    </div>
</div>

<script>
    const gamesData = [
        { nombre: "Uno Clásico", imagen: "uno.png", jugadores: "2-10", tiempo: "15 min" },
        { nombre: "Uno No Mercy", imagen: "unonomercy.png", jugadores: "2-6", tiempo: "15 min" },
        { nombre: "Uno Gigante", imagen: "unogigante.png", jugadores: "2-10", tiempo: "15 min" },
        { nombre: "Jenga", imagen: "jenga.png", jugadores: "1-8", tiempo: "10 min" },
        { nombre: "Monopoly", imagen: "monopoly.png", jugadores: "2-6", tiempo: "90 min" },
        { nombre: "Paceñopolis", imagen: "paceño.png", jugadores: "2-6", tiempo: "90 min" },
        { nombre: "Ludo", imagen: "ludo.png", jugadores: "2-4", tiempo: "30-60 min" },
        { nombre: "Catan", imagen: "catan.png", jugadores: "3-4", tiempo: "60 min" },
        { nombre: "Cartas de Póker", imagen: "cartas.png", jugadores: "2-5+", tiempo: "Variable" },
        { nombre: "Ajedrez", imagen: "chess.png", jugadores: "2", tiempo: "30+ min" },
        { nombre: "Basta", imagen: "basta.png", jugadores: "2+", tiempo: "15-30 min" },
        { nombre: "Polilla Tramposa", imagen: "polilla.png", jugadores: "3-5", tiempo: "15 min" },
        { nombre: "Virus", imagen: "virus.png", jugadores: "2-6", tiempo: "20 min" },
        { nombre: "Virus 2", imagen: "virus2.png", jugadores: "2-6", tiempo: "20 min" },
        { nombre: "Agua de Calzón", imagen: "aguadecal.png", jugadores: "3+", tiempo: "30-60 min" },
        { nombre: "Amigos de Mierda", imagen: "amigosdem.png", jugadores: "3+", tiempo: "20 min" },
        { nombre: "Amigos de Mierda 2", imagen: "amigosdem2.png", jugadores: "3", tiempo: "20 min" },
        { nombre: "Decisiones de Mierda", imagen: "decisiones.png", jugadores: "5+", tiempo: "20-40 min" },
        { nombre: "Sí señor oscuro", imagen: "siseñor.png", jugadores: "4-8", tiempo: "20 min" },
        { nombre: "Happy Salmon", imagen: "happysalmon.png", jugadores: "3-8", tiempo: "5 min" },
        { nombre: "Taco Gato Cabra Queso Pizza", imagen: "taco.png", jugadores: "2-8", tiempo: "10 min" },
        { nombre: "Who Am I?", imagen: "who.png", jugadores: "2+", tiempo: "15 min" },
        { nombre: "Penguin Trap", imagen: "penguin.png", jugadores: "2-4", tiempo: "5-10 min" },
        { nombre: "60 Segundos", imagen: "60s.png", jugadores: "2+", tiempo: "30 min" },
        { nombre: "Ojos de halcon", imagen: "halcon.png", jugadores: "2-6", tiempo: "15 min" },
        { nombre: "CASHFLOW", imagen: "cashflow.png", jugadores: "2-6", tiempo: "60-180 min" },
        { nombre: "Clue", imagen: "clue.png", jugadores: "2-6", tiempo: "45 min" },
        { nombre: "Pictionary", imagen: "pictionary.png", jugadores: "3+", tiempo: "30-60 min" },
        { nombre: "Juego del Calamar", imagen: "calamar.png", jugadores: "3-6", tiempo: "45 min" },
        { nombre: "Cranium", imagen: "cranium.png", jugadores: "4", tiempo: "45 min" },
        { nombre: "Scrabble", imagen: "scrabble.png", jugadores: "2-4", tiempo: "45 min" },
        { nombre: "Rummikub", imagen: "rummikub.png", jugadores: "2-4", tiempo: "30 min" },
        { nombre: "Hedbanz", imagen: "hedbanz.png", jugadores: "2-6", tiempo: "15 min" },
        { nombre: "Wall Game", imagen: "wall.png", jugadores: "2-4", tiempo: "5-15 min" },
        { nombre: "Falling Monkeys", imagen: "monkeys.png", jugadores: "2-4", tiempo: "10-15 min" },
        { nombre: "Bingo", imagen: "bingo.png", jugadores: "2+", tiempo: "30 min" },
        { nombre: "Que Waso", imagen: "waso.png", jugadores: "3+", tiempo: "45 min" },
        { nombre: "Aguarda", imagen: "aguarda.png", jugadores: "3+", tiempo: "30 min" },
        { nombre: "Amazing Roulette", imagen: "roulette.png", jugadores: "2-6", tiempo: "15 min" },
        { nombre: "Gongi", imagen: "gongi.png", jugadores: "2+", tiempo: "10 min" },
        { nombre: "Rompecabezas Naruto (200pcs)", imagen: "naruto.png", jugadores: "2+", tiempo: "15+ min" },
        { nombre: "Rompecabezas Demon Slayer (200pcs)", imagen: "demon.png", jugadores: "2+", tiempo: "15+ min" },
        { nombre: "Rompecabezas Record of Ragnarok (200pcs)", imagen: "record.png", jugadores: "2+", tiempo: "15+ min" },
        { nombre: "Rompecabezas Animales (100pcs)", imagen: "animales.png", jugadores: "2+", tiempo: "15+ min" }
    ];

    function renderGames(juegosParaMostrar) {
        const container = document.getElementById('games-container');
        container.innerHTML = ''; 
        
        if(juegosParaMostrar.length === 0) {
            container.innerHTML = '<div class="no-results">No se encontraron juegos con ese nombre 😢🎲</div>';
            return;
        }

        juegosParaMostrar.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            
            // NUEVO: Envolvemos el contenido en una etiqueta <a> que redirige a detalle.html
            card.innerHTML = `
                <a href="detalle.html?juego=${encodeURIComponent(game.nombre)}" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%;">
                    <div class="game-img-box">
                        <div class="img-placeholder">🎲</div>
                        <img src="${game.imagen}" alt="${game.nombre}" class="game-img" onerror="this.style.display='none'">
                    </div>
                    <div class="game-info">
                        <div class="game-title">${game.nombre}</div>
                        <div class="game-details">👥 ${game.jugadores} <br> ⏱️ ${game.tiempo}</div>
                    </div>
                </a>
            `;
            container.appendChild(card);
        });
    }

    renderGames(gamesData);

    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', function() {
        const textoBusqueda = this.value.toLowerCase(); 
        
        const juegosFiltrados = gamesData.filter(game => 
            game.nombre.toLowerCase().includes(textoBusqueda)
        );
        
        renderGames(juegosFiltrados);
    });

    const btnTop = document.getElementById("btnTop");
    
    window.addEventListener("scroll", function() {
        if (window.scrollY > 300) {
            btnTop.style.display = "flex";
        } else {
            btnTop.style.display = "none";
        }
    });

    btnTop.addEventListener("click", function(e) {
        e.preventDefault(); 
        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });
</script>
</body>
</html>
