<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Protecito Anticafé</title>
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Chewy&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffd6e8;
            --text-dark: #3a2224;
            --highlight: #f596c5;
            --price-color: #5c3538;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 40px 15px;
            display: flex;
            justify-content: center;
            background-image: 
                radial-gradient(#f596c5 15%, transparent 16%),
                radial-gradient(#f596c5 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            scroll-behavior: smooth;
        }

        .menu-container {
            background-color: var(--bg-color);
            max-width: 650px;
            width: 100%;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15), inset 0 0 20px rgba(255,255,255,0.5);
            position: relative;
        }

        .menu-inner-border {
            border: 3px dashed #f18bbd;
            border-radius: 15px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.35); 
            position: relative;
            z-index: 3;
        }

        h1 {
            font-family: 'Chewy', cursive;
            text-align: center;
            font-size: 3.5rem;
            margin: 0;
            line-height: 1.1;
            letter-spacing: 2px;
            color: var(--text-dark);
            text-shadow: 2px 2px 0px #fff; 
        }

        .subtitle {
            text-align: center;
            font-size: 1.3rem;
            margin-top: 5px;
            margin-bottom: 30px;
            font-weight: 800;
            color: #6a4245;
            letter-spacing: 1px;
        }

        h2 {
            font-family: 'Caveat', cursive;
            text-align: center;
            font-size: 2.8rem;
            position: relative;
            display: inline-block;
            margin: 25px 0 15px 0;
            z-index: 1;
            color: var(--text-dark);
            padding: 0 15px;
        }

        h2::after {
            content: "";
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            height: 16px;
            background-color: var(--highlight);
            z-index: -1;
            border-radius: 8px;
            opacity: 0.9;
            transform: rotate(-1.5deg);
        }

        .section-center {
            text-align: center;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 25px;
            margin-bottom: 30px;
        }

        @media (max-width: 500px) {
            .menu-grid {
                grid-template-columns: 1fr; 
                gap: 12px; 
            }
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline; 
            font-size: 1.15rem;
            font-weight: 800;
            transition: transform 0.2s; 
        }

        .menu-item:hover {
            transform: scale(1.02) translateX(3px);
        }

        .item-name {
            display: flex;
            align-items: baseline;
            white-space: nowrap; 
        }

        .item-name::before {
            content: "•";
            color: #d85c96; 
            margin-right: 6px;
            font-size: 1.5rem;
        }

        .item-dots {
            flex-grow: 1;
            border-bottom: 3px dotted #e3a2c2; 
            margin: 0 8px;
            position: relative;
            top: -6px; 
            opacity: 0.7;
            min-width: 15px; 
        }

        .item-price {
            white-space: nowrap;
            color: var(--price-color);
        }

        .price-currency {
            font-size: 0.85em;
            font-weight: 900;
        }

        /* MENÚ DESPLEGABLE DE HELADOS */
        .helados-dropdown {
            margin: 10px 0 30px 0;
            background-color: rgba(255, 255, 255, 0.65);
            border: 2.5px dashed #f18bbd;
            border-radius: 18px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .helados-dropdown summary {
            list-style: none;
            cursor: pointer;
            padding: 10px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.85);
            user-select: none;
            transition: background-color 0.2s ease;
        }

        .helados-dropdown summary::-webkit-details-marker {
            display: none;
        }

        .helados-dropdown summary:hover {
            background-color: #fff;
        }

        .helados-dropdown[open] summary {
            border-bottom: 2px dashed #f18bbd;
        }

        .helados-title {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-dark);
            position: relative;
            z-index: 1;
            padding: 0 10px;
        }

        .helados-title::after {
            content: "";
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            height: 14px;
            background-color: var(--highlight);
            z-index: -1;
            border-radius: 8px;
            opacity: 0.9;
            transform: rotate(-1.5deg);
        }

        .helados-toggle-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--highlight);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 3px 8px rgba(245, 150, 197, 0.45);
        }

        .helados-arrow {
            display: inline-block;
            font-size: 0.8rem;
            transition: transform 0.25s ease;
        }

        .helados-dropdown[open] .helados-arrow {
            transform: rotate(180deg);
        }

        .helados-grid {
            grid-template-columns: 1fr;
            gap: 10px;
            padding: 18px 20px;
            margin-bottom: 0;
        }

        .helados-grid .item-name {
            white-space: normal;
        }

        .btn-juegos-container {
            text-align: center;
            margin: 40px 0 20px 0;
        }

        .btn-juegos {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #d85c96;
            color: white;
            text-decoration: none;
            font-family: 'Chewy', cursive;
            font-size: 1.8rem;
            padding: 12px 30px;
            border-radius: 30px;
            box-shadow: 0 6px 0 #b33973, 0 10px 15px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
            position: relative;
            z-index: 5;
        }

        .btn-juegos:hover {
            background-color: #e56ca5;
            transform: translateY(2px);
            box-shadow: 0 4px 0 #b33973, 0 8px 10px rgba(0,0,0,0.2);
        }

        .btn-juegos:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #b33973, 0 2px 5px rgba(0,0,0,0.2);
        }

        .btn-icon {
            font-size: 2rem;
        }

        /* BOTÓN VOLVER ARRIBA */
        .btn-top {
            display: none; 
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 99;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            border: none;
            outline: none;
            background-color: #d85c96;
            color: white;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background-color 0.3s, transform 0.2s;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .btn-top:hover {
            background-color: #e56ca5;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .social-footer {
            margin-top: 40px;
            text-align: center;
            border-top: 2px dashed #f18bbd;
            padding-top: 25px;
        }

        .social-footer p {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            color: var(--text-dark);
            margin-top: 0;
            margin-bottom: 15px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap; 
        }

        .social-icon {
            text-decoration: none;
            background-color: var(--highlight);
            color: var(--text-dark);
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(245, 150, 197, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 5;
        }

        .social-icon:hover {
            background-color: #f18bbd;
            color: #fff;
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(245, 150, 197, 0.6);
        }

        .axolotl-img { 
            position: absolute; 
            z-index: 10; 
            pointer-events: none;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.15));
        }

        .axolotl-1 { top: -45px; left: -40px; width: 170px; } 
        .axolotl-2 { top: 20px; right: -25px; width: 200px; transform: rotate(15deg); } 
        .axolotl-3 { bottom: 40px; left: -35px; width: 120px; transform: rotate(-10deg); } 

        .pink-blob { position: absolute; background-color: var(--highlight); border-radius: 50%; z-index: 1; }
        .blob-1 { top: -20px; left: -30px; width: 180px; height: 160px; opacity: 0.8; }
        .blob-2 { bottom: -30px; right: -40px; width: 220px; height: 220px; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; opacity: 0.8; }

        @media (max-width: 480px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 2.2rem; }
            
            .menu-item { font-size: 1rem; }
            .menu-inner-border { padding: 20px 10px; }
            .item-dots { margin: 0 4px; }
            .helados-title { font-size: 2.1rem; }
            .helados-dropdown summary { padding: 10px 14px; }
            .helados-grid { padding: 14px 12px; }
            .social-icon { padding: 8px 15px; font-size: 0.9rem; }
            .social-footer p { font-size: 1.8rem; }
            .btn-juegos { font-size: 1.5rem; padding: 10px 25px; }
            
            .axolotl-1 { width: 130px; left: -20px; top: -30px; }
            .axolotl-2 { width: 120px; right: -15px; top: 10px; }
            .axolotl-3 { width: 90px; left: -20px; bottom: 80px; }
            
            .btn-top { bottom: 15px; right: 15px; width: 45px; height: 45px; font-size: 1.2rem; }
        }

    </style>
</head>
<body>

<a href="#" id="btnTop" class="btn-top" title="Volver arriba">
    ⇮
</a>

<div class="menu-container">
    
    <img src="ajolote_1.png" class="axolotl-img axolotl-1" alt=" ">
    <img src="ajolote_2.png" class="axolotl-img axolotl-2" alt=" ">
    <img src="ajolote_3.png" class="axolotl-img axolotl-3" alt=" ">

    <div class="pink-blob blob-1"></div>
    <div class="pink-blob blob-2"></div>
    
    <div class="menu-inner-border">
        <h1>PROTECITO<br>ANTICAFE</h1>
        <div class="subtitle">Tu espacio, tu tiempo</div>

        <!-- Bebidas Calientes -->
        <div class="section-center">
            <h2>Bebidas Calientes</h2>
        </div>
        <div class="menu-grid" id="bebidas-calientes"></div>

        <!-- Bebidas Frías -->
        <div class="section-center">
            <h2>Bebidas Frías</h2>
        </div>
        <div class="menu-grid" id="bebidas-frias"></div>

        <!-- Snacks -->
        <div class="section-center">
            <h2>Snacks & Comida</h2>
        </div>
        <div class="menu-grid" id="snacks"></div>

        <!-- Helados (Desplegable) -->
        <details class="helados-dropdown">
            <summary>
                <span class="helados-title">🍦 Helados</span>
                <span class="helados-toggle-pill">Ver lista <span class="helados-arrow">▼</span></span>
            </summary>
            <div class="menu-grid helados-grid" id="helados"></div>
        </details>

        <!-- Especiales -->
        <div class="section-center">
            <h2>Especiales de temporada</h2>
        </div>
        <div class="menu-grid" id="especiales"></div>

        <!-- BOTÓN MENÚ DE JUEGOS -->
        <div class="btn-juegos-container">
            <a href="juegos.html" class="btn-juegos">
                <span class="btn-icon">🎲</span> Ver Menú de Juegos
            </a>
        </div>

        <div class="social-footer">
            <p>¡Síguenos en nuestras redes!</p>
            <div class="social-links">
                <a href="https://www.instagram.com/anticafeprotecito?obrf=MWIycXJ0dDRiNTd4NA==" class="social-icon" target="_blank">📷 Instagram</a>
                <a href="https://www.facebook.com/share/1FF72Qfqp2/" class="social-icon" target="_blank">📘 Facebook</a>
                <a href="https://www.tiktok.com/@anticafe_protecito?_r=1&_t=ZS-99l2sxTX08y" class="social-icon" target="_blank">🎵 TikTok</a>
            </div>
        </div>
    </div>
</div>

<script>
    const menuData = {
        bebidasCalientes: [
            { nombre: "Café", precio: "5" },
            { nombre: "Chocolate", precio: "7" },
            { nombre: "Mate", precio: "4" },
            { nombre: "Té", precio: "4" }
        ],
        bebidasFrias: [
            { nombre: "Protecito Latte", precio: "7" },
            { nombre: "Jugo", precio: "5" },
            { nombre: "Soda", precio: "3.5" },
            { nombre: "Agua (c/s hielo)", precio: "3" },
            { nombre: "Té helado", precio: "6" },
            { nombre: "Azul Protecito", precio: "9" },
            { nombre: "Violeta Protecito", precio: "9" },
            { nombre: "Esmeralda Protecito", precio: "9" },
            { nombre: "Brisa de Coco", precio: "9" }
        ],
        snacks: [
            { nombre: "Pipocas c/mantequilla", precio: "3" },
            { nombre: "Pipocas c/chocolate", precio: "4" },
            { nombre: "Cereal", precio: "6" },
            { nombre: "Fideos instantáneos", precio: "13" }
        ],
        helados: [
            { nombre: "Tentación", precio: "8.50" },
            { nombre: "Tentación Cono", precio: "8.50" },
            { nombre: "Cono", precio: "8.50" },
            { nombre: "Griego (Cono Yogurt Pie de Limón)", precio: "8.50" },
            { nombre: "Megacono (Pasas al Ron)", precio: "6.50" },
            { nombre: "Ricoco Cono", precio: "5" },
            { nombre: "Rocky", precio: "4" },
            { nombre: "Negrito", precio: "3.50" },
            { nombre: "Deli Pop", precio: "3" },
            { nombre: "Alfredo Canela", precio: "1.50" },
            { nombre: "Delizaurio", precio: "1.50" },
            { nombre: "Bolo Frutas", precio: "1" }
        ],
        especiales: [
            { nombre: "Amanecer Dorado 2.0", precio: "10" }
        ]
    };

    function renderMenu(seccionId, items) {
        const container = document.getElementById(seccionId);
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            
            div.innerHTML = `
                <span class="item-name">${item.nombre}</span>
                <span class="item-dots"></span>
                <span class="item-price">${item.precio} <span class="price-currency">Bs</span></span>
            `;
            container.appendChild(div);
        });
    }

    renderMenu('bebidas-calientes', menuData.bebidasCalientes);
    renderMenu('bebidas-frias', menuData.bebidasFrias);
    renderMenu('snacks', menuData.snacks);
    renderMenu('helados', menuData.helados);
    renderMenu('especiales', menuData.especiales);

    // Funcionalidad del botón de volver arriba
    const btnTop = document.getElementById("btnTop");
    window.addEventListener("scroll", function() {
        if (window.scrollY > 300) {
            btnTop.style.display = "flex";
        } else {
            btnTop.style.display = "none";
        }
    });

    btnTop.addEventListener("click", function(e) {
        e.preventDefault(); 
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
</script>
</body>
</html>
