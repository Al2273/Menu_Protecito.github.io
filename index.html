<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Protecito Anticafé</title>
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Chewy&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f6ebd8; 
            --text-dark: #3e1f13; 
            --highlight: #a96f4c; 
            --accent-peach: #ffa89c; 
            --price-color: #5c3826; 
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 40px 15px;
            display: flex;
            justify-content: center;
            background-image: 
                radial-gradient(rgba(169, 111, 76, 0.25) 15%, transparent 16%),
                radial-gradient(rgba(169, 111, 76, 0.25) 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .menu-container {
            background-color: var(--bg-color);
            max-width: 650px;
            width: 100%;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 15px 40px rgba(62, 31, 19, 0.15), inset 0 0 20px rgba(255,255,255,0.6);
            position: relative;
        }

        .menu-inner-border {
            border: 3px dashed var(--highlight);
            border-radius: 15px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.4); 
            position: relative;
            z-index: 3;
        }

        h1 {
            font-family: 'Chewy', cursive;
            text-align: center;
            font-size: 3.5rem;
            margin: 0;
            line-height: 1.1;
            letter-spacing: 2px;
            color: var(--text-dark);
            text-shadow: 2px 2px 0px #fff; 
        }

        .subtitle {
            text-align: center;
            font-size: 1.3rem;
            margin-top: 5px;
            margin-bottom: 30px;
            font-weight: 800;
            color: #5c3826;
            letter-spacing: 1px;
        }

        h2 {
            font-family: 'Caveat', cursive;
            text-align: center;
            font-size: 2.8rem;
            position: relative;
            display: inline-block;
            margin: 25px 0 15px 0;
            z-index: 1;
            color: var(--text-dark);
            padding: 0 15px;
        }

        h2::after {
            content: "";
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            height: 16px;
            background-color: var(--highlight);
            z-index: -1;
            border-radius: 8px;
            opacity: 0.7;
            transform: rotate(-1.5deg);
        }

        .section-center {
            text-align: center;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 25px;
            margin-bottom: 30px;
        }

        /* 
         LA SOLUCIÓN: Cambiamos a 1 columna forzada en celulares
        */
        @media (max-width: 500px) {
            .menu-grid {
                grid-template-columns: 1fr; /* 1 sola columna */
                gap: 12px; /* Reducimos el espacio entre filas */
            }
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline; 
            font-size: 1.15rem;
            font-weight: 800;
            transition: transform 0.2s; 
        }

        .menu-item:hover {
            transform: scale(1.02) translateX(3px);
        }

        .item-name {
            display: flex;
            align-items: baseline;
            white-space: nowrap; /* Volvemos a nowrap para que no se parta nunca */
        }

        .item-name::before {
            content: "•";
            color: var(--highlight); 
            margin-right: 6px;
            font-size: 1.5rem;
        }

        .item-dots {
            flex-grow: 1;
            border-bottom: 3px dotted #d4a383; 
            margin: 0 8px;
            position: relative;
            top: -6px; 
            opacity: 0.7;
            min-width: 15px; 
        }

        .item-price {
            white-space: nowrap;
            color: var(--price-color);
        }

        .price-currency {
            font-size: 0.85em;
            font-weight: 900;
        }

        .btn-juegos-container {
            text-align: center;
            margin: 40px 0 20px 0;
        }

        .btn-juegos {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #8b5133;
            color: white;
            text-decoration: none;
            font-family: 'Chewy', cursive;
            font-size: 1.8rem;
            padding: 12px 30px;
            border-radius: 30px;
            box-shadow: 0 6px 0 #5c3826, 0 10px 15px rgba(62, 31, 19, 0.2);
            transition: all 0.1s ease;
            position: relative;
            z-index: 5;
        }

        .btn-juegos:hover {
            background-color: var(--highlight);
            transform: translateY(2px);
            box-shadow: 0 4px 0 #5c3826, 0 8px 10px rgba(62, 31, 19, 0.2);
        }

        .btn-juegos:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #5c3826, 0 2px 5px rgba(62, 31, 19, 0.2);
        }

        .btn-icon {
            font-size: 2rem;
        }

        .social-footer {
            margin-top: 40px;
            text-align: center;
            border-top: 2px dashed var(--highlight);
            padding-top: 25px;
        }

        .social-footer p {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            color: var(--text-dark);
            margin-top: 0;
            margin-bottom: 15px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap; 
        }

        .social-icon {
            text-decoration: none;
            background-color: var(--highlight);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(169, 111, 76, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 5;
        }

        .social-icon:hover {
            background-color: #8b5133;
            transform: translateY(-4px);
            box-shadow: 0 6px 15px rgba(169, 111, 76, 0.6);
        }

        .axolotl-img { 
            position: absolute; 
            z-index: 10; 
            pointer-events: none;
            filter: drop-shadow(0px 10px 10px rgba(62, 31, 19, 0.15));
        }

        .axolotl-1 { top: -45px; left: -40px; width: 170px; } 
        .axolotl-2 { top: 20px; right: -25px; width: 200px; transform: rotate(15deg); } 
        .axolotl-3 { bottom: 40px; left: -35px; width: 120px; transform: rotate(-10deg); } 

        .color-blob { position: absolute; background-color: var(--accent-peach); border-radius: 50%; z-index: 1; }
        .blob-1 { top: -20px; left: -30px; width: 180px; height: 160px; opacity: 0.7; }
        .blob-2 { bottom: -30px; right: -40px; width: 220px; height: 220px; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; opacity: 0.7; }

        @media (max-width: 480px) {
            h1 { font-size: 2.5rem; }
            h2 { font-size: 2.2rem; }
            
            /* Ajustes menores para celular */
            .menu-item { font-size: 1rem; }
            .menu-inner-border { padding: 20px 10px; }
            .item-dots { margin: 0 4px; }
            .social-icon { padding: 8px 15px; font-size: 0.9rem; }
            .social-footer p { font-size: 1.8rem; }
            .btn-juegos { font-size: 1.5rem; padding: 10px 25px; }
            
            .axolotl-1 { width: 130px; left: -20px; top: -30px; }
            .axolotl-2 { width: 120px; right: -15px; top: 10px; }
            .axolotl-3 { width: 90px; left: -20px; bottom: 80px; }
        }

    </style>
</head>
<body>

<div class="menu-container">
    
    <img src="ajolote_1.png" class="axolotl-img axolotl-1" alt=" ">
    <img src="ajolote_2.png" class="axolotl-img axolotl-2" alt=" ">
    <img src="ajolote_3.png" class="axolotl-img axolotl-3" alt=" ">

    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>
    
    <div class="menu-inner-border">
        <h1>PROTECITO<br>ANTICAFE</h1>
        <div class="subtitle">Tu espacio, tu tiempo</div>

        <div class="section-center">
            <h2>Menú completo</h2>
        </div>
        
        <div class="menu-grid" id="menu-completo"></div>

        <div class="section-center">
            <h2>Especiales de temporada</h2>
        </div>

        <div class="menu-grid" id="especiales"></div>

        <!-- BOTÓN MENÚ DE JUEGOS -->
        <div class="btn-juegos-container">
            <a href="juegos.html" class="btn-juegos">
                <span class="btn-icon">🎲</span> Ver Menú de Juegos
            </a>
        </div>

        <div class="social-footer">
            <p>¡Síguenos en nuestras redes!</p>
            <div class="social-links">
                <a href="https://www.instagram.com/anticafe_protecito?stkn=MTJkbGdneGs1dDI1eg==" class="social-icon" target="_blank">📷 Instagram</a>
                <a href="https://www.facebook.com/share/1FF72Qfqp2/" class="social-icon" target="_blank">📘 Facebook</a>
                <a href="https://www.tiktok.com/@anticafe_protecito?_r=1&_t=ZS-99l2sxTX08y" class="social-icon" target="_blank">🎵 TikTok</a>
            </div>
        </div>
    </div>
</div>

<script>
    const menuData = {
        completo: [
            { nombre: "Jugo", precio: "5" },
            { nombre: "Soda", precio: "3.50" },
            { nombre: "Agua (c/s hielo)", precio: "0" },
            { nombre: "Protecito Latte", precio: "7" },
            { nombre: "Té helado", precio: "6" },
            { nombre: "Chocolate", precio: "7" },
            { nombre: "Café", precio: "5" },
            { nombre: "Mate", precio: "4" },
            { nombre: "Té", precio: "4" },
            { nombre: "Cereal", precio: "6" },
            { nombre: "Pipocas (chocolate/mantequilla)", precio: "3" },
            { nombre: "Papas fritas (salada/picante)", precio: "3" },
            { nombre: "Ramen", precio: "13" },
        ],
        especiales: [
            { nombre: "Amanecer Dorado 2.0", precio: "7" },
        ]
    };

    function renderMenu(seccionId, items) {
        const container = document.getElementById(seccionId);
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            
            // Volvemos a la estructura original, mucho más limpia
            div.innerHTML = `
                <span class="item-name">${item.nombre}</span>
                <span class="item-dots"></span>
                <span class="item-price">${item.precio} <span class="price-currency">Bs</span></span>
            `;
            container.appendChild(div);
        });
    }

    renderMenu('menu-completo', menuData.completo);
    renderMenu('especiales', menuData.especiales);
</script>
</body>
</html>
